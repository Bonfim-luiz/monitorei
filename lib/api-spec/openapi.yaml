openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Monitorei API
servers:
  - url: /api
tags:
  - name: health
  - name: users
  - name: concursos
  - name: cidades
  - name: convocacoes
  - name: pdf
  - name: results
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    post:
      operationId: registerUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /users/by-email:
    get:
      operationId: getUserByEmail
      tags: [users]
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /concursos:
    get:
      operationId: listConcursos
      tags: [concursos]
      responses:
        "200":
          description: List of concursos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConcursoList"

  /cidades:
    get:
      operationId: listCidades
      tags: [cidades]
      responses:
        "200":
          description: List of cidades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CidadeList"

  /convocacoes:
    get:
      operationId: listConvocacoes
      tags: [convocacoes]
      responses:
        "200":
          description: List of convocacoes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvocacaoList"

  /pdf/upload:
    post:
      operationId: uploadPdf
      tags: [pdf]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdf:
                  type: string
                  format: binary
              required:
                - pdf
      responses:
        "200":
          description: PDF uploaded and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: No file provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pdf/status:
    get:
      operationId: getPdfStatus
      tags: [pdf]
      responses:
        "200":
          description: PDF status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdfStatus"

  /results:
    get:
      operationId: getResults
      tags: [results]
      responses:
        "200":
          description: Latest check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultList"

  /results/check:
    post:
      operationId: runCheck
      tags: [results]
      responses:
        "200":
          description: Check ran and results saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultList"
        "400":
          description: No PDF loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/notify:
    post:
      operationId: sendNotifications
      tags: [results]
      responses:
        "200":
          description: Notifications sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterUserRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        plano:
          type: string
          enum: [basic, pro, premium]
          default: basic
        cidadeId:
          type: integer
          default: 1
        concursoIds:
          type: array
          items:
            type: integer
          default: [1]
        frequencia:
          type: string
          enum: [semanal, mensal]
          default: semanal
      required: [nome, email]

    User:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        plano:
          type: string
        status:
          type: string
        frequencia:
          type: string
        cidadeId:
          type: integer
          nullable: true
        cidadeNome:
          type: string
          nullable: true
        concursoId:
          type: integer
          nullable: true
        concursoIds:
          type: array
          items:
            type: integer
        createdAt:
          type: string
      required: [id, nome, email, plano, status, frequencia, concursoIds, createdAt]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        plano:
          type: string
        status:
          type: string
        frequencia:
          type: string
        cidadeNome:
          type: string
          nullable: true
        concursos:
          type: array
          items:
            $ref: "#/components/schemas/ConcursoStatus"
      required: [id, nome, email, plano, status, frequencia, concursos]

    ConcursoStatus:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cidade:
          type: string
        convocado:
          type: boolean
        totalConvocados:
          type: integer
        ultimaConvocacao:
          type: string
          nullable: true
      required: [id, nome, cidade, convocado, totalConvocados]

    UserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [users]

    Concurso:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cidadeId:
          type: integer
        cidadeNome:
          type: string
      required: [id, nome, cidadeId, cidadeNome]

    ConcursoList:
      type: object
      properties:
        concursos:
          type: array
          items:
            $ref: "#/components/schemas/Concurso"
      required: [concursos]

    Cidade:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
      required: [id, nome]

    CidadeList:
      type: object
      properties:
        cidades:
          type: array
          items:
            $ref: "#/components/schemas/Cidade"
      required: [cidades]

    Convocacao:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        concursoId:
          type: integer
        concursoNome:
          type: string
        data:
          type: string
      required: [id, nome, concursoId, concursoNome, data]

    ConvocacaoList:
      type: object
      properties:
        convocacoes:
          type: array
          items:
            $ref: "#/components/schemas/Convocacao"
      required: [convocacoes]

    PdfStatus:
      type: object
      properties:
        hasFile:
          type: boolean
        filename:
          type: string
          nullable: true
        uploadedAt:
          type: string
          nullable: true
        pageCount:
          type: integer
          nullable: true
      required: [hasFile]

    UploadResult:
      type: object
      properties:
        success:
          type: boolean
        filename:
          type: string
        pageCount:
          type: integer
        message:
          type: string
      required: [success, filename, pageCount, message]

    CheckResult:
      type: object
      properties:
        userId:
          type: integer
        nome:
          type: string
        email:
          type: string
        found:
          type: boolean
      required: [userId, nome, email, found]

    ResultList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        checkedAt:
          type: string
          nullable: true
        hasPdf:
          type: boolean
      required: [results, hasPdf]

    NotifyResult:
      type: object
      properties:
        sent:
          type: integer
        failed:
          type: integer
        message:
          type: string
      required: [sent, failed, message]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
