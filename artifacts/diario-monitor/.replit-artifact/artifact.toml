kind = "web"
previewPath = "/"
title = "Monitor de Convocações"
version = "1.0.0"
id = "artifacts/diario-monitor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19609
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/diario-monitor run dev"

[services.env]
PORT = "19609"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/diario-monitor", "run", "build"]
publicDir = "artifacts/diario-monitor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
